<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kurulum — Program Seçimi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4d8eff;text-decoration:none}a:hover{color:#7aaaff}
input::placeholder{color:#71717a}
@keyframes ugUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ugPulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ugSlide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.ug-in{animation:ugUp .55s cubic-bezier(.2,.7,.2,1) both}
.ug-pulse{animation:ugPulse 1.6s ease-in-out infinite}
.ug-in.ug-pulse{animation:ugUp .55s cubic-bezier(.2,.7,.2,1) both,ugPulse 1.6s ease-in-out 1.6s infinite}
.ug-slide{animation:ugSlide 1.4s ease-in-out infinite}
.ug-btn{background:#232328;border:1px solid rgba(255,255,255,.08);color:#f4f4f5;transition:background-color .15s ease-out}
.ug-btn:hover{background:#2c2c32;color:#f4f4f5}
.ug-cta{background:#f4f4f5;color:#0c0c0e;transition:opacity .15s ease-out}
.ug-cta:hover{opacity:.88;color:#0c0c0e}
.ug-opt{background:#141417;transition:background-color .15s ease-out,border-color .15s ease-out}
.ug-opt:hover{background:#1f1f23}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1280px; height: 800px;">
  <dc-import name="V2Installer" step="{{n}}" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return { n: 2 }; }
}
</script>
</body>
</html>
