<?xml version="1.0" encoding="UTF-8"?>
<!-- UniveGame app icon, "Yörünge" (Orbit). Master artwork for 64 px and larger.
     Canvas 1024×1024 per Apple's macOS icon grid: body 824×824 at (100,100), corner radius 185.
     Colors are UniveGame tokens: card #18181B, text-primary #F4F4F5, accent #4D8EFF.
     Layer order matters: back orbit → controller → front orbit + planet (the orbit passes behind, then in front). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Body: graphite squircle with a 1 px (at 256 pt) hairline -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#18181B" filter="url(#iconShadow)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="4"/>

  <!-- Orbit, back half (full ellipse; the controller covers the middle) -->
  <g transform="rotate(-18 512 512)">
    <ellipse cx="512" cy="512" rx="378" ry="128" fill="none" stroke="#4D8EFF" stroke-width="28"/>
  </g>

  <!-- Controller -->
  <path d="M300 430 C300 382 340 360 390 360 H634 C684 360 724 382 724 430 L760 600 C772 660 720 702 676 664 L612 610 H412 L348 664 C304 702 252 660 264 600 Z" fill="#F4F4F5"/>
  <path d="M400 440 V500 M370 470 H430" stroke="#18181B" stroke-width="22" stroke-linecap="round"/>
  <circle cx="612" cy="452" r="20" fill="#18181B"/>
  <circle cx="656" cy="494" r="20" fill="#18181B"/>

  <!-- Orbit, front half + planet (drawn over the controller) -->
  <g transform="rotate(-18 512 512)">
    <path d="M134 512 A378 128 0 0 0 890 512" fill="none" stroke="#4D8EFF" stroke-width="28" stroke-linecap="round"/>
    <circle cx="157" cy="556" r="36" fill="#4D8EFF" stroke="#18181B" stroke-width="14"/>
  </g>
</svg>
