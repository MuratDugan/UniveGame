<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Simge rayı</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Ana gezinme" style="width: 80px; height: 800px; box-sizing: border-box; flex-shrink: 0; background: #0c0c0e; border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; align-items: center; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; color: #a1a1aa;">
  <div style="height: 52px; display: flex; align-items: center; gap: 8px;">
    <span style="width: 12px; height: 12px; border-radius: 999px; background: #ff5f57;"></span>
    <span style="width: 12px; height: 12px; border-radius: 999px; background: #febc2e;"></span>
    <span style="width: 12px; height: 12px; border-radius: 999px; background: #28c840;"></span>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 16px;">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <a href="{{it.href}}" class="ug-rail" aria-current="{{it.cur}}" style="width: 64px; height: 56px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; background: {{it.bg}}; color: {{it.fg}};">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{it.ic}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
        <span style="font-size: 11px; font-weight: {{it.fw}};">{{it.label}}</span>
      </a>
    </sc-for>
  </div>
  <span style="flex-grow: 1;"></span>
  <a href="V2Settings.dc.html" class="ug-rail" aria-label="Ayarlar" style="width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{gearBg}}; color: {{gearFg}};">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </a>
  <div title="Motor hazır" style="height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
    <span class="ug-pulse" style="width: 8px; height: 8px; border-radius: 999px; background: #30d158;"></span>
    <span style="font-size: 10px; color: #a1a1aa;">Motor</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sel":{"editor":"enum","options":["library","discover","stores","add","settings","none"],"default":"library"},"$preview":{"width":80,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const sel = this.props.sel ?? 'library';
    const raw = [
      { id: 'library', label: 'Kütüphane', href: 'V2Library.dc.html', d: 'M4 19V5M9 19V5M14.5 19.5l-1-14.5 4-.5 3 14z' },
      { id: 'discover', label: 'Keşfet', href: 'V2Discover.dc.html', d: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM16.2 7.8l-2.1 6.3-6.3 2.1 2.1-6.3z' },
      { id: 'stores', label: 'Mağazalar', href: 'V2Stores.dc.html', d: 'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71' },
      { id: 'add', label: 'Ekle', href: 'V2AddGame.dc.html', d: 'M12 5v14M5 12h14' }
    ];
    const items = raw.map((r) => {
      const on = r.id === sel;
      return { ...r, cur: on ? 'page' : 'false', bg: on ? '#18181b' : 'transparent', fg: on ? '#f4f4f5' : '#a1a1aa', ic: on ? '#4d8eff' : 'currentColor', fw: on ? 600 : 500 };
    });
    const g = sel === 'settings';
    return { items, gearBg: g ? '#18181b' : 'transparent', gearFg: g ? '#4d8eff' : '#a1a1aa' };
  }
}
</script>
</body>
</html>
