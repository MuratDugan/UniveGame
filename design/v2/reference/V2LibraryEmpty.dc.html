<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Kütüphane — Boş</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4d8eff;text-decoration:none}a:hover{color:#7aaaff}
@keyframes ugUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ugBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes ugPulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ugEdge{0%,100%{border-color:rgba(255,255,255,.16)}50%{border-color:rgba(77,142,255,.6)}}
.ug-in{animation:ugUp .55s cubic-bezier(.2,.7,.2,1) both}
.ug-bob{animation:ugBob 4s ease-in-out infinite}
.ug-pulse{animation:ugPulse 1.6s ease-in-out infinite}
.ug-edge{animation:ugEdge 2.4s ease-in-out infinite}
.ug-rail{transition:background-color .15s ease-out,color .15s ease-out}
.ug-rail:hover{background-color:#18181b;color:#f4f4f5}
.ug-btn{background:#232328;border:1px solid rgba(255,255,255,.08);color:#f4f4f5;transition:background-color .15s ease-out}
.ug-btn:hover{background:#2c2c32;color:#f4f4f5}
.ug-cta{background:#f4f4f5;color:#0c0c0e;transition:opacity .15s ease-out}
.ug-cta:hover{opacity:.88;color:#0c0c0e}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; overflow: hidden; background: #0c0c0e; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px;">
  <dc-import name="V2Rail" sel="library" hint-size="80px,800px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; padding: 48px;">
    <div aria-hidden="true" style="display: flex; align-items: flex-end; gap: 20px; height: 230px;">
      <div style="transform: rotate(-6deg);">
        <div class="ug-bob" style="width: 120px; height: 180px; box-sizing: border-box; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.16); background: #141417;"></div>
      </div>
      <div style="transform: translateY(-16px);">
        <div class="ug-bob" style="animation-delay: -1.3s; width: 140px; height: 210px; box-sizing: border-box; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.16); background: #18181b; display: flex; align-items: center; justify-content: center; color: #71717a;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </div>
      </div>
      <div style="transform: rotate(6deg);">
        <div class="ug-bob" style="animation-delay: -2.6s; width: 120px; height: 180px; box-sizing: border-box; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.16); background: #141417;"></div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 460px; text-align: center;">
      <h1 class="ug-in" style="margin: 0; font-size: 30px; font-weight: 700;">Rafların boş</h1>
      <p class="ug-in" style="animation-delay: 80ms; margin: 0; font-size: 13px; line-height: 1.55; color: #a1a1aa;">Steam ya da Epic hesabını bağla; oyunların gelir ve Mac'te ne kadar iyi çalışacaklarına göre raflara dizilir.</p>
      <div class="ug-in" style="animation-delay: 160ms; display: flex; gap: 8px; padding-top: 12px;">
        <a href="V2Stores.dc.html" class="ug-cta" style="height: 40px; display: flex; align-items: center; padding: 0 24px; border-radius: 8px; font-size: 13px; font-weight: 600;">Mağaza Hesabı Bağla</a>
        <a href="V2AddGame.dc.html" class="ug-btn" style="height: 40px; box-sizing: border-box; display: flex; align-items: center; padding: 0 16px; border-radius: 8px; font-size: 13px; font-weight: 500;">Oyun Ekle</a>
      </div>
    </div>
    <div class="ug-in ug-edge" style="animation-delay: 240ms; display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.16); color: #a1a1aa;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>
      <span style="font-size: 13px;">Ya da bir <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: #f4f4f5;">.exe</span> ya da kurulum dosyasını pencereye sürükle</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
