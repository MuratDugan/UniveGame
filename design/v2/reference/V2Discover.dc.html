<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Keşfet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4d8eff;text-decoration:none}a:hover{color:#7aaaff}
input::placeholder{color:#71717a}
@keyframes ugUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ugPulse{0%,100%{opacity:1}50%{opacity:.4}}
.ug-in{animation:ugUp .55s cubic-bezier(.2,.7,.2,1) both}
.ug-pulse{animation:ugPulse 1.6s ease-in-out infinite}
.ug-rail{transition:background-color .15s ease-out,color .15s ease-out}
.ug-rail:hover{background-color:#18181b;color:#f4f4f5}
.ug-chip{transition:background-color .15s ease-out,color .15s ease-out}
.ug-chip:hover{background-color:#18181b;color:#f4f4f5}
.ug-tile{background:#18181b;border:1px solid rgba(255,255,255,.08);transition:border-color .15s ease-out}
.ug-tile:hover{border-color:rgba(255,255,255,.5)}
.ug-zoom{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.ug-tile:hover .ug-zoom{transform:scale(1.04)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ug-tile:hover .ug-zoom{transform:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; overflow: hidden; background: #0c0c0e; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px;">
  <dc-import name="V2Rail" sel="discover" hint-size="80px,800px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; overflow: hidden; padding: 52px 48px 0; display: flex; flex-direction: column; gap: 20px;">
    <div class="ug-in" style="display: flex; align-items: flex-end; gap: 24px;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
        <h1 style="margin: 0; font-size: 30px; font-weight: 700;">Keşfet</h1>
        <p style="margin: 0; font-size: 13px; color: #a1a1aa;">Steam'de öne çıkanlar, Mac'te ne kadar iyi çalışacaklarıyla birlikte. Fiyatlar Steam mağazasından.</p>
      </div>
      <label style="width: 260px; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 12px; box-sizing: border-box; border-radius: 999px; background: #18181b; border: 1px solid rgba(255,255,255,0.08); color: #a1a1aa;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3"></path></svg>
        <input type="search" placeholder="Steam mağazasında ara" aria-label="Steam mağazasında ara" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; color: #f4f4f5; font: inherit; font-size: 13px;">
      </label>
    </div>
    <div class="ug-in" style="animation-delay: 60ms; display: flex; gap: 6px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button type="button" class="ug-chip" style="height: 28px; padding: 0 12px; border: none; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: {{c.fw}};">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 210px; gap: 16px;">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="7">
        <a href="#" class="ug-tile ug-in" style="animation-delay: {{t.delay}}; grid-column: span {{t.cs}}; grid-row: span {{t.rs}}; display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; color: #f4f4f5;">
          <div style="flex-grow: 1; overflow: hidden;">
            <div class="ug-zoom" style="width: 100%; height: 100%; background: {{t.art}}; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box;">
              <span style="font-size: 11px; color: rgba(255,255,255,0.5);">Mağaza görseli</span>
            </div>
          </div>
          <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: {{t.pad}};">
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px;">
              <span style="font-size: {{t.fs}}; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{t.name}}</span>
              <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; color: #a1a1aa;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.tc}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.td}}"></path></svg>
                <span style="font-variant-numeric: tabular-nums;">{{t.score}}</span> · {{t.tier}}</span>
            </div>
            <span style="height: 22px; display: flex; align-items: center; padding: 0 8px; border-radius: 999px; background: rgba(48,209,88,0.14); color: #30d158; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;">{{t.off}}</span>
            <span style="display: flex; flex-direction: column; align-items: flex-end;">
              <span style="font-size: 11px; color: #a1a1aa; text-decoration: line-through; font-variant-numeric: tabular-nums;">{{t.was}}</span>
              <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">{{t.now}}</span>
            </span>
          </div>
        </a>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const C = 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z';
    const tier = (s) => s >= 80 ? ['#30d158', C + 'm-4-10 3 3 5-6', 'Mükemmel']
      : s >= 60 ? ['#86d96b', C + 'm-4-10 3 3 5-6', 'İyi']
      : s >= 40 ? ['#ffb340', 'M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01', 'Oynanabilir']
      : s >= 20 ? ['#ff8a3d', C + 'M8 12h8', 'Zayıf'] : ['#ff453a', C + 'm3-13-6 6M9 9l6 6', 'Çalışmaz'];
    const L = [
      ['Hades II', 90, '#3b1f2a', '-25%', '$29,99', '$22,49', 2, 2],
      ['Hollow Knight: Silksong', 94, '#2a2230', '-20%', '$19,99', '$15,99', 1, 1],
      ['Cyberpunk 2077', 72, '#35321a', '-65%', '$59,99', '$20,99', 1, 1],
      ["Baldur's Gate 3", 84, '#2b2420', '-30%', '$59,99', '$41,99', 1, 1],
      ['Stardew Valley', 100, '#223a28', '-40%', '$14,99', '$8,99', 1, 1],
      ['ELDEN RING', 46, '#2e2a1f', '-50%', '$59,99', '$29,99', 2, 1],
      ['Dead Cells', 95, '#1e2e33', '-60%', '$24,99', '$9,99', 1, 1],
      ['Celeste', 98, '#2a2034', '-75%', '$19,99', '$4,99', 1, 1]
    ];
    const tiles = L.map(([name, score, art, off, was, now, cs, rs], i) => {
      const [tc, td, tn] = tier(score);
      const big = cs === 2 && rs === 2;
      return { name, score, art, off, was, now, cs, rs, tc, td, tier: tn, delay: (120 + i * 50) + 'ms', pad: big ? '16px 20px' : '12px 14px', fs: big ? '17px' : '13px' };
    });
    const chips = [['Öne çıkanlar', true], ['İndirimde'], ['Mac’te mükemmel'], ['Yeni çıkanlar']].map(([label, on]) => ({
      label, bg: on ? '#232328' : 'transparent', fg: on ? '#f4f4f5' : '#a1a1aa', fw: on ? 600 : 500
    }));
    return { tiles, chips };
  }
}
</script>
</body>
</html>
