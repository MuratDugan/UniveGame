<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Oyun sayfası</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; overflow: hidden; background: #0c0c0e; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px;">
  <dc-import name="V2Rail" sel="library" hint-size="80px,800px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">
    <header style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 24px;">
      <a href="V2Library.dc.html" class="ug-rail" style="height: 30px; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 6px; border-radius: 8px; color: #a1a1aa; font-size: 13px; font-weight: 500;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Kütüphane</a>
      <span style="flex-grow: 1;"></span>
      <button type="button" class="ug-btn" aria-label="{{favLabel}}" aria-pressed="{{favPressed}}" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="{{favFill}}" stroke="{{favStroke}}" stroke-width="2" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg></button>
      <button type="button" class="ug-btn" aria-label="Diğer eylemler" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
    </header>
    <div style="flex-grow: 1; overflow: hidden; padding: 8px 32px 0; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 40px; align-items: start;">
      <aside style="display: flex; flex-direction: column; gap: 16px;">
        <div class="ug-in" style="width: 260px; height: 390px; border-radius: 8px; background: {{g.cover}}; outline: 1px solid rgba(255,255,255,0.16); outline-offset: -1px; box-shadow: 0 6px 32px rgba(0,0,0,0.45); display: flex; align-items: flex-end; padding: 12px; box-sizing: border-box;">
          <span style="font-size: 12px; color: rgba(255,255,255,0.55);">Kapak · 600 × 900</span>
        </div>
        <div class="ug-in" style="animation-delay: 80ms;">
          <sc-if value="{{g.ctaPrimary}}" hint-placeholder-val="{{true}}">
            <button type="button" class="ug-cta" style="width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"></path></svg>{{g.cta}}</button>
          </sc-if>
          <sc-if value="{{g.ctaSecondary}}" hint-placeholder-val="{{false}}">
            <button type="button" class="ug-btn" disabled="{{g.ctaDisabled}}" style="width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; opacity: {{g.ctaOpacity}};">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.ctaD}}"></path></svg>{{g.cta}}</button>
          </sc-if>
        </div>
        <dl class="ug-in" style="animation-delay: 140ms; margin: 0; display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{g.facts}}" as="f" hint-placeholder-count="4">
            <div style="display: flex; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08);">
              <dt style="font-size: 12px; color: #a1a1aa;">{{f.k}}</dt>
              <dd style="margin: 0; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums;">{{f.v}}</dd>
            </div>
          </sc-for>
        </dl>
      </aside>
      <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0;">
        <div class="ug-in" style="display: flex; flex-direction: column; gap: 6px;">
          <span style="font-size: 12px; font-weight: 600; color: #a1a1aa;">{{g.kicker}}</span>
          <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 36px;">{{g.name}}</h1>
        </div>
        <sc-if value="{{g.hasNotice}}" hint-placeholder-val="{{false}}">
          <div role="status" class="ug-in" style="animation-delay: 60ms; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #18181b; border: 1px solid {{g.noticeEdge}};">
            <svg width="20" height="20" viewBox="0 0 24 24" style="flex-shrink: 0;" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="{{g.noticeColor}}"></circle><path d="{{g.noticeGlyph}}" fill="none" stroke="#0c0c0e" stroke-width="2.6" stroke-linecap="round"></path></svg>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 13px; font-weight: 600;">{{g.noticeTitle}}</span>
              <span style="font-size: 12px; line-height: 1.45; color: #a1a1aa;">{{g.noticeText}}</span>
            </div>
            <sc-if value="{{g.noticeCta}}" hint-placeholder-val="{{false}}">
              <a href="V2Settings.dc.html" class="ug-cta" style="height: 32px; display: flex; align-items: center; padding: 0 20px; border-radius: 8px; font-size: 13px; font-weight: 600;">Kur</a>
            </sc-if>
            <sc-if value="{{g.noticeLink}}" hint-placeholder-val="{{false}}">
              <a href="#" style="font-size: 12px; font-weight: 500;">Durumu takip et</a>
            </sc-if>
          </div>
        </sc-if>
        <section aria-label="Uyumluluk" class="ug-in" style="animation-delay: 120ms; display: flex; flex-direction: column; gap: 16px; padding: 16px; border-radius: 12px; background: #18181b; border: 1px solid rgba(255,255,255,0.08);">
          <div style="display: flex; align-items: center; gap: 16px;">
            <span style="font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;">{{g.score}}</span>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
              <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600; color: {{g.tc}};">
                <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="{{g.tc}}"></circle><path d="{{g.tg}}" fill="none" stroke="#0c0c0e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{g.tier}} · {{g.summary}}</span>
              <span style="font-size: 12px; color: #a1a1aa;">{{g.confidence}}</span>
            </div>
            <button type="button" class="ug-btn" style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 8px; font: inherit; font-size: 12px; font-weight: 500;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"></path></svg>Yeniden İncele</button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <div style="position: relative;">
              <div class="ug-grow" style="animation-delay: 300ms; display: flex; gap: 3px;">
                <sc-for list="{{g.segs}}" as="sg" hint-placeholder-count="5">
                  <div style="flex: 1; height: 8px; border-radius: 3px; background: #232328; overflow: hidden;">
                    <div style="height: 8px; width: {{sg.fill}}; background: {{g.tc}};"></div>
                  </div>
                </sc-for>
              </div>
              <span class="ug-in" style="animation-delay: 900ms; position: absolute; top: -4px; left: {{g.pin}}; width: 3px; height: 16px; border-radius: 2px; background: #f4f4f5; box-shadow: 0 0 0 2px #18181b;"></span>
            </div>
            <div style="display: flex; gap: 3px;">
              <sc-for list="{{g.segs}}" as="sg" hint-placeholder-count="5">
                <span style="flex: 1; font-size: 11px; color: {{sg.lc}}; font-weight: {{sg.lw}};">{{sg.label}}</span>
              </sc-for>
            </div>
          </div>
          <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; row-gap: 10px;">
            <sc-for list="{{g.factors}}" as="f" hint-placeholder-count="4">
              <li style="display: flex; align-items: flex-start; gap: 8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="{{f.c}}"></circle><path d="{{f.g}}" fill="none" stroke="#0c0c0e" stroke-width="3" stroke-linecap="round"></path></svg>
                <span style="flex-grow: 1; font-size: 12px; line-height: 1.45;">{{f.text}}</span>
                <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; color: #a1a1aa;">{{f.impact}}</span>
              </li>
            </sc-for>
          </ul>
        </section>
        <section aria-label="Başlatma ayarları" class="ug-in" style="animation-delay: 180ms; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 12px; background: #18181b; border: 1px solid rgba(255,255,255,0.08);">
          <div style="display: flex; align-items: center; gap: 16px;">
            <h2 style="margin: 0; flex-grow: 1; font-size: 13px; font-weight: 600;">Başlatma ayarları</h2>
            <div role="radiogroup" aria-label="Grafik" style="display: flex; padding: 2px; border-radius: 8px; background: #232328;">
              <sc-for list="{{gfx}}" as="o" hint-placeholder-count="4">
                <button type="button" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 26px; padding: 0 12px; border: none; border-radius: 6px; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 12px; font-weight: {{o.fw}}; transition: background-color .15s ease-out, color .15s ease-out; cursor: pointer;">{{o.label}}</button>
              </sc-for>
            </div>
          </div>
          <span style="font-size: 12px; color: #a1a1aa;">{{gfxHelp}}</span>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{toggles}}" as="t" hint-placeholder-count="4">
              <button type="button" role="switch" aria-checked="{{t.on}}" onClick="{{t.flip}}" class="ug-opt" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid {{t.edge}}; text-align: left; font: inherit; color: #f4f4f5; cursor: pointer;">
                <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0;">
                  <span style="font-size: 13px;">{{t.label}}</span>
                  <span style="font-size: 12px; color: #a1a1aa;">{{t.help}}</span>
                </span>
                <span style="width: 34px; height: 20px; flex-shrink: 0; box-sizing: border-box; padding: 2px; border-radius: 999px; background: {{t.bg}}; display: flex; justify-content: {{t.jc}}; transition: background-color .15s ease-out;">
                  <span style="width: 16px; height: 16px; border-radius: 999px; background: {{t.knob}};"></span>
                </span>
              </button>
            </sc-for>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"game":{"editor":"enum","options":["hades","apex","cyberpunk"],"default":"hades"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const d = this.data(props.game ?? 'hades');
    this.state = { gfx: d.gfx, tog: d.tog.slice() };
  }
  data(id) {
    const D = {
      hades: {
        name: 'Hades', kicker: 'Steam · Supergiant Games · 2020', cover: '#5a2a1f', fav: true,
        score: 92, summary: 'Sorunsuz çalışmalı', confidence: 'Yüksek güven: birden fazla kaynak aynı şeyi söylüyor. İncelendi 2 gün önce.',
        cta: 'Oyna', mode: 'play', gfx: 'Otomatik', tog: [true, false, false, false],
        facts: [['Durum', 'Yüklü · 15 GB'], ['Oynama süresi', '42 sa'], ['Son oynama', '1 saat önce'], ['Konum', '~/Oyunlar/Hades']],
        factors: [['good', 'Steam Deck Doğrulandı.', '+12'], ['good', 'ProtonDB: Platinum (2.140 rapor).', '+10'], ['good', 'DirectX 11: DXVK ile Metal üzerinde.', '+8'], ['info', 'Bulut kayıtları Steam ile eşitlenir.', '']]
      },
      apex: {
        name: 'Apex Legends', kicker: 'Steam · Respawn · 2019', cover: '#26405a', fav: false,
        score: 10, summary: 'Mac’te açılmaz', confidence: 'Yüksek güven: birden fazla kaynak aynı şeyi söylüyor. İncelendi 6 dakika önce.',
        cta: 'Yine de Yükle', mode: 'secondary', gfx: 'Otomatik', tog: [true, false, false, false],
        notice: ['bad', 'Easy Anti-Cheat engelliyor', 'Anti-cheat Wine’ı tanımıyor. Yapımcı izin verene kadar yüklesen de oyun açılmaz.', 'link'],
        facts: [['Durum', 'Yüklü değil'], ['Tahmini boyut', '75 GB'], ['Kaynak', 'Steam'], ['Oyuncu sayısı', 'Çok oyunculu']],
        factors: [['bad', 'Wine’ı engelleyen anti-cheat (Easy Anti-Cheat).', '−60'], ['warn', 'DirectX 12: D3DMetal gerekiyor; kurulu değil.', '−30'], ['info', 'ProtonDB: Silver (1.791 rapor).', '']]
      },
      cyberpunk: {
        name: 'Cyberpunk 2077', kicker: 'Steam · CD PROJEKT RED · 2020', cover: '#4a4520', fav: true,
        score: 72, summary: 'D3DMetal ile iyi çalışmalı', confidence: 'Orta güven: kaynaklar çoğunlukla aynı şeyi söylüyor. İncelendi dün.',
        cta: 'Oyna', mode: 'disabled', gfx: 'D3DMetal', tog: [true, true, false, false],
        notice: ['warn', 'Önce D3DMetal’i kur', 'Bu oyun DirectX 12 kullanıyor. Motor yaklaşık 290 MB; Apple’ın Game Porting Toolkit’i de gerekir.', 'cta'],
        facts: [['Durum', 'Yüklü · 65 GB'], ['Oynama süresi', '3 sa'], ['Son oynama', 'Geçen hafta'], ['Konum', '~/Oyunlar/Cyberpunk']],
        factors: [['warn', 'DirectX 12: D3DMetal kurulu değil.', '−30'], ['good', 'ProtonDB: Gold (5.212 rapor).', '+8'], ['good', 'MetalFX ölçekleme destekleniyor.', '+4'], ['info', '64-bit oyun: D3DMetal ile uyumlu.', '']]
      }
    };
    return D[id] || D.hades;
  }
  renderVals() {
    const d = this.data(this.props.game ?? 'hades');
    const s = d.score;
    const T = s >= 80 ? ['#30d158', 'Mükemmel', 'm8 12 3 3 5-6'] : s >= 60 ? ['#86d96b', 'İyi', 'm8 12 3 3 5-6']
      : s >= 40 ? ['#ffb340', 'Oynanabilir', 'M12 7v6M12 17h.01'] : s >= 20 ? ['#ff8a3d', 'Zayıf', 'M12 7v6M12 17h.01'] : ['#ff453a', 'Çalışmaz', 'm15 9-6 6M9 9l6 6'];
    const K = { good: ['#30d158', 'M8 12h8M12 8v8'], warn: ['#ffb340', 'M8 12h8'], bad: ['#ff453a', 'm15 9-6 6M9 9l6 6'], info: ['#71717a', 'M12 11v6M12 7.5h.01'] };
    const labels = ['Çalışmaz', 'Zayıf', 'Oynanabilir', 'İyi', 'Mükemmel'];
    const curIdx = Math.min(4, Math.floor(s / 20));
    const segs = labels.map((label, i) => ({
      label, fill: Math.max(0, Math.min(1, (s - i * 20) / 20)) * 100 + '%',
      lc: i === curIdx ? T[0] : '#a1a1aa', lw: i === curIdx ? 600 : 400
    }));
    const n = d.notice;
    const g = {
      ...d, tc: T[0], tier: T[1], tg: T[2], segs, pin: 'calc(' + s + '% - 1.5px)',
      facts: d.facts.map(([k, v]) => ({ k, v })),
      factors: d.factors.map(([kind, text, impact]) => ({ text, impact, c: K[kind][0], g: K[kind][1] })),
      ctaPrimary: d.mode === 'play', ctaSecondary: d.mode !== 'play',
      ctaDisabled: d.mode === 'disabled', ctaOpacity: d.mode === 'disabled' ? 0.4 : 1,
      ctaD: d.mode === 'disabled' ? 'M7 4.5v15l12-7.5z' : 'M12 3v12M7 10l5 5 5-5M5 21h14',
      hasNotice: !!n,
      noticeColor: n ? K[n[0]][0] : '', noticeGlyph: n ? (n[0] === 'bad' ? 'm15 9-6 6M9 9l6 6' : 'M12 7v6M12 17h.01') : '',
      noticeEdge: n ? (n[0] === 'bad' ? 'rgba(255,69,58,0.35)' : 'rgba(255,179,64,0.35)') : 'transparent',
      noticeTitle: n ? n[1] : '', noticeText: n ? n[2] : '',
      noticeCta: !!n && n[3] === 'cta', noticeLink: !!n && n[3] === 'link'
    };
    const cur = this.state.gfx;
    const gfx = ['Otomatik', 'DXVK', 'D3DMetal', 'WineD3D'].map((label) => ({
      label, on: label === cur ? 'true' : 'false', bg: label === cur ? '#3a3a40' : 'transparent',
      fg: label === cur ? '#f4f4f5' : '#a1a1aa', fw: label === cur ? 600 : 500,
      pick: () => this.setState({ gfx: label })
    }));
    const TL = [
      ['Retina çözünürlük', 'Daha keskin, biraz daha yavaş'],
      ['MetalFX ölçekleme', 'DLSS sunan DirectX 12 oyunlarında'],
      ['Performans göstergesi', 'Kare hızı ve GPU kullanımı'],
      ['Command, Control gibi', 'Ctrl kısayolları kullanan oyunlar']
    ];
    const toggles = TL.map(([label, help], i) => {
      const on = this.state.tog[i];
      return {
        label, help, on: on ? 'true' : 'false',
        bg: on ? '#4d8eff' : '#232328', jc: on ? 'flex-end' : 'flex-start', knob: on ? '#f4f4f5' : '#a1a1aa',
        edge: on ? 'rgba(77,142,255,0.45)' : 'rgba(255,255,255,0.08)',
        flip: () => { const t = this.state.tog.slice(); t[i] = !t[i]; this.setState({ tog: t }); }
      };
    });
    return {
      g, gfx, toggles,
      gfxHelp: cur === 'Otomatik' ? 'Otomatik, oyunun DirectX sürümüne en uygun motoru seçer. Sadece oyun açılmıyorsa değiştir.' : cur + ' elle seçildi. Sorun olursa Otomatik’e dön.',
      favLabel: d.fav ? 'Favorilerden çıkar' : 'Favorilere ekle', favPressed: d.fav ? 'true' : 'false',
      favFill: d.fav ? '#ff5c6c' : 'none', favStroke: d.fav ? '#ff5c6c' : '#f4f4f5'
    };
  }
}
</script>
</body>
</html>
