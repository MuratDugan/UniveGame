<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Mağazalar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#4d8eff;text-decoration:none}a:hover{color:#7aaaff}
@keyframes ugUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes ugGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ugPulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes ugSlide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
.ug-in{animation:ugUp .55s cubic-bezier(.2,.7,.2,1) both}
.ug-grow{transform-origin:left center;animation:ugGrow 1s cubic-bezier(.2,.7,.2,1) both}
.ug-pulse{animation:ugPulse 1.6s ease-in-out infinite}
.ug-slide{animation:ugSlide 1.4s ease-in-out infinite}
.ug-rail{transition:background-color .15s ease-out,color .15s ease-out}
.ug-rail:hover{background-color:#18181b;color:#f4f4f5}
.ug-btn{background:#232328;border:1px solid rgba(255,255,255,.08);color:#f4f4f5;transition:background-color .15s ease-out}
.ug-btn:hover{background:#2c2c32;color:#f4f4f5}
.ug-cta{background:#f4f4f5;color:#0c0c0e;transition:opacity .15s ease-out}
.ug-cta:hover{opacity:.88;color:#0c0c0e}
.ug-tile{background:#18181b;transition:background-color .15s ease-out}
.ug-tile:hover{background:#1f1f23}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; overflow: hidden; background: #0c0c0e; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif; font-size: 13px;">
  <dc-import name="V2Rail" sel="stores" hint-size="80px,800px"></dc-import>
  <main style="flex-grow: 1; min-width: 0; overflow: hidden; padding: 52px 48px 0; display: flex; flex-direction: column; gap: 28px;">
    <div style="display: flex; align-items: flex-end; gap: 32px;">
      <div class="ug-in" style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px;">
        <h1 style="margin: 0; font-size: 30px; font-weight: 700;">Mağazalar</h1>
        <p style="margin: 0; font-size: 13px; color: #a1a1aa;">Her mağaza kendi Windows ortamında çalışır. Girişi mağazanın kendi sayfasında yaparsın.</p>
      </div>
      <div class="ug-in" style="animation-delay: 80ms; width: 300px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #a1a1aa;">
          <span><span style="color: #f4f4f5; font-weight: 600; font-variant-numeric: tabular-nums;">2 / 5</span> mağaza bağlı</span>
          <span style="font-variant-numeric: tabular-nums;">243 oyun</span>
        </div>
        <div class="ug-grow" style="animation-delay: 300ms; display: flex; gap: 4px;">
          <span style="flex: 1; height: 6px; border-radius: 3px; background: #30d158;"></span>
          <span style="flex: 1; height: 6px; border-radius: 3px; background: #30d158;"></span>
          <span style="flex: 1; height: 6px; border-radius: 3px; background: #232328;"></span>
          <span style="flex: 1; height: 6px; border-radius: 3px; background: #232328;"></span>
          <span style="flex: 1; height: 6px; border-radius: 3px; background: #232328;"></span>
        </div>
      </div>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{stores}}" as="s" hint-placeholder-count="5">
        <li class="ug-tile ug-in" style="animation-delay: {{s.delay}}; display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.08);">
          <span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 8px; background: #232328; display: flex; align-items: center; justify-content: center; color: #f4f4f5;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{s.d}}"></path></svg></span>
          <span style="width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; font-weight: 600;">{{s.name}}</span>
            <span style="font-size: 12px; line-height: 1.45; color: #a1a1aa;">{{s.desc}}</span>
          </span>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{s.fg}};">
              <span class="{{s.dotClass}}" style="width: 8px; height: 8px; border-radius: 999px; background: {{s.dot}};"></span>{{s.status}}</span>
            <span style="font-size: 12px; color: #a1a1aa; font-variant-numeric: tabular-nums;">{{s.meta}}</span>
            <sc-if value="{{s.syncing}}" hint-placeholder-val="{{false}}">
              <span style="position: relative; width: 160px; height: 3px; border-radius: 999px; background: #232328; overflow: hidden;">
                <span class="ug-slide" style="position: absolute; left: 0; top: 0; width: 34%; height: 3px; border-radius: 999px; background: #4d8eff;"></span>
              </span>
            </sc-if>
          </span>
          <span style="display: flex; gap: 8px;">
            <sc-for list="{{s.buttons}}" as="b" hint-placeholder-count="2">
              <button type="button" class="{{b.cls}}" style="height: 34px; padding: 0 16px; border-radius: 8px; border: none; font: inherit; font-size: 13px; font-weight: {{b.fw}}; cursor: pointer;">{{b.label}}</button>
            </sc-for>
          </span>
        </li>
      </sc-for>
    </ul>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const sec = (label) => ({ label, cls: 'ug-btn', fw: 500 });
    const cta = (label) => ({ label, cls: 'ug-cta', fw: 600 });
    const on = { fg: '#30d158', dot: '#30d158', dotClass: '' };
    const off = { fg: '#a1a1aa', dot: '#3a3a40', dotClass: '' };
    const L = [
      { name: 'Steam', d: 'M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z', ...on, fg: '#4d8eff', dot: '#4d8eff', dotClass: 'ug-pulse',
        status: 'Eşitleniyor', meta: '196 oyun · 3 yeni bulundu', syncing: true,
        desc: "Windows Steam istemcisi. Steam'de her zamanki gibi giriş yap, oyun yükle ve oyna.", buttons: [sec("Steam'i Aç")] },
      { name: 'Epic Games', d: 'M13 2 3 14h9l-1 8 10-12h-9l1-8z', ...on, status: 'Bağlı', meta: '47 oyun · 2 dk önce eşitlendi',
        desc: 'Açık kaynak Legendary istemcisi. Oyunlar Epic başlatıcısı olmadan yüklenir.', buttons: [sec('Yenile'), sec('Çıkış Yap')] },
      { name: 'GOG', d: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', ...off, status: 'Kurulmadı', meta: 'Yaklaşık 40 MB',
        desc: "Heroic'in gogdl aracı. DRM'siz oyunlar doğrudan kütüphanene yüklenir.", buttons: [cta('Kur')] },
      { name: 'Ubisoft Connect', d: 'M12 2 3 7v10l9 5 9-5V7z', ...off, status: 'Kurulmadı', meta: 'Yaklaşık 300 MB',
        desc: 'Oyunlar onun üzerinden açılır; giriş ve güncellemeler çalışmaya devam eder.', buttons: [sec('Başlatıcıyı Kur')] },
      { name: 'EA app', d: 'M4 4h16v16H4zM9 9h6v6H9z', ...off, status: 'Kurulmadı', meta: 'Yaklaşık 250 MB',
        desc: 'EA uygulamasını kurar. Oyunlar onun üzerinden açılır.', buttons: [sec('Başlatıcıyı Kur')] }
    ];
    const stores = L.map((s, i) => ({ syncing: false, ...s, delay: (140 + i * 60) + 'ms' }));
    return { stores };
  }
}
</script>
</body>
</html>
